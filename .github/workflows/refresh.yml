name: Refresh proxy lists

on:
  schedule:
    # Hourly at minute 12 (offset from :00 to reduce CI load spikes)
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lists
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest sources
        run: python3 harvest.py --sources sources.json --outdir data

      - name: Validate and rank proxies
        run: python3 check.py --pool data --out lists --probes 2 --workers 400 --timeout 8 --history data/history.json

      - name: Publish to private data repo
        env:
          FLEET_DATA_TOKEN: ${{ secrets.FLEET_DATA_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/data-pub
          git clone --depth 1 https://github.com/ons96/proxy-fleet-data.git /tmp/data-pub
          mkdir -p /tmp/data-pub/data
          cp -r lists /tmp/data-pub/
          cp data/history.json /tmp/data-pub/data/ 2>/dev/null || true
          cd /tmp/data-pub
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to proxy data"
          else
            git commit -m "auto: refresh proxy lists $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push https://x-access-token:${FLEET_DATA_TOKEN}@github.com/ons96/proxy-fleet-data.git HEAD:main
          fi