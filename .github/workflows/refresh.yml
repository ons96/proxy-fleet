name: Refresh proxy lists

on:
  schedule:
    # Hourly at minute 12 (offset from :00 to reduce CI load spikes)
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest sources
        run: python3 harvest.py --sources sources.json --outdir data

      - name: Validate and rank proxies
        run: python3 check.py --pool data --out lists --probes 2 --workers 400 --timeout 8 --history data/history.json

      - name: Commit refreshed lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lists/ data/history.json
          if git diff --cached --quiet; then
            echo "No changes to lists"
          else
            git commit -m "auto: refresh proxy lists $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || git pull --rebase origin main
            git push
          fi

      - name: Upload lists as artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-lists
          path: lists/
          if-no-files-found: error